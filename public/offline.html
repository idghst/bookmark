<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <title>오프라인 | Bookmark</title>
    <style>
      * { box-sizing: border-box; }
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background: #ffffff;
        color: #0a0a0a;
        font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main { max-width: 28rem; padding: 2rem; text-align: center; }
      img { width: 5rem; height: 5rem; border-radius: 1.25rem; }
      h1 { margin: 1.5rem 0 0.5rem; font-size: 1.5rem; }
      p { margin: 0 0 1.5rem; color: #737373; }
      a {
        display: inline-block;
        padding: 0.65rem 1rem;
        border-radius: 0.5rem;
        background: #171717;
        color: #fafafa;
        font-weight: 600;
        text-decoration: none;
      }
      a:hover { background: #333333; }
      a:focus-visible { outline: 2px solid #171717; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>현재 오프라인입니다</h1>
      <p>네트워크 연결을 확인한 뒤 다시 시도해 주세요.</p>
      <a href="/">다시 시도</a>
    </main>
  </body>
</html>
